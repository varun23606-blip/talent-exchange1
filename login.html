<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Talent Exchange</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div id="navbar-mount"></div>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <img src="assets/logo.svg" class="auth-logo" alt="Talent Exchange">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your student talent exchange account</p>
      </div>

      <div id="auth-error" class="error-banner"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Student Email</label>
          <input type="email" id="login-email" class="form-input" placeholder="student@talentexchange.edu" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="password-toggle" data-target="login-password">Show</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
          Sign In
        </button>

        <p class="auth-footer-text">
          Don't have an account? <a href="register.html">Register here</a>
        </p>

        <!-- Link to Admin Login -->
        <div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); text-align: center;">
          <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 6px;">
            Are you a platform administrator?
          </p>
          <a href="admin-login.html" class="btn btn-secondary btn-sm" style="display: inline-block; font-size: 0.82rem; border-color: rgba(245, 158, 11, 0.4); color: #fbbf24;">
            🛡️ Sign In to Admin Portal →
          </a>
        </div>

        <div style="margin-top:16px; padding:12px; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:var(--radius-sm); font-size:0.82rem; color:var(--text-muted); text-align:center;">
          💡 <strong>Student Demo Accounts:</strong><br>
          <code>mahadev@talentexchange.edu</code> / <code>Password123!</code><br>
          <code>rahul@talentexchange.edu</code> / <code>Password123!</code>
        </div>
      </form>
    </div>
  </main>

  <!-- Firebase Web SDK (v10.8.0) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => renderNavbar("login"));
  </script>
</body>
</html>
